[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codeforge"
version = "0.1.0"
description = "Multi-agent software engineering team. Issue to PR pipeline."
requires-python = ">=3.12"
license = { text = "Apache-2.0" }

dependencies = [
  "boto3>=1.35.0",
  "anthropic>=0.39.0",
  "claude-agent-sdk>=0.1.0",
  "pydantic>=2.8.0",
  "structlog>=24.4.0",
  "PyYAML>=6.0",
  "rich>=13.7.0",
  "tenacity>=9.0.0",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-cov>=5.0.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.5.5",
  "mypy>=1.10.0",
  "pre-commit>=3.7.0",
]

[tool.hatch.build.targets.wheel]
# Hatchling cannot infer the package: the distribution is named after the
# project but the code lives in src/, so an editable install fails with
# "Unable to determine which files to ship inside the wheel".
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "N", "S", "TCH", "ARG", "RET"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.per-file-ignores]
# Tests assert; that is what they are for.
# ARG001: pytest fixtures are passed by name and often unused in the body.
# PLC0415: imports inside a test keep an optional dependency scoped to it.
"tests/**" = ["S101", "ARG", "PLC0415"]

# Lambda handlers take (event, context) to satisfy the runtime contract even
# when context is unused, and import boto3 lazily to keep cold starts short.
"src/lambdas/**" = ["ARG001", "PLC0415"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
# boto3 and botocore ship no type information. Their call sites are typed on
# our side; this only stops mypy reporting the library itself.
module = ["boto3.*", "botocore.*", "structlog.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-markers", "--cov=src", "--cov-fail-under=45"]
testpaths = ["tests"]
asyncio_mode = "auto"
