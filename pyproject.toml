[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codeforge"
version = "0.1.0"
description = "Multi-agent software engineering team. Issue to PR pipeline."
requires-python = ">=3.12"
license = { text = "Apache-2.0" }

dependencies = [
  "boto3>=1.35.0",
  "anthropic>=0.39.0",
  "claude-agent-sdk>=0.1.0",
  "pydantic>=2.8.0",
  "structlog>=24.4.0",
  "PyYAML>=6.0",
  "rich>=13.7.0",
  "tenacity>=9.0.0",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-cov>=5.0.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.5.5",
  "mypy>=1.10.0",
  "pre-commit>=3.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "N", "S", "TCH", "ARG", "RET"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-markers", "--cov=src", "--cov-fail-under=85"]
testpaths = ["tests"]
asyncio_mode = "auto"
